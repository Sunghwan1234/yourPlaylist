<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <link rel="icon" href="favicon.ico">
    <title>YourPlayList</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
</head>
<body>
    <button id="settings" onclick="showSettings()">⛭</button>
    <div hidden id="s_settingsPanel">
        <p>Settings</p>
        <p><input id="s_useThumbnail" type="checkbox">Use Thumbnail for Video</p>
        <p><input id="s_forceLoad" type="checkbox">Force Load</p>
        <p><input id="s_forceSave" type="checkbox">Force Save (With Force Load)</p>
    </div>
    <div class="box">
        <div id="absolute">
            <video id="video" controls playsinline hidden></video>
            <img id="thumbnail" src="" alt="">
            <div id="video_details">
                <h1 id="video_name">VIDEO NAME!</h1>
                <p id="video_author">VIDEO AUTHOR!</p>
            </div>
        </div>
        <div id="playlistContainer" class="defaultPlaylistContainer">
            <div id="playlistControls">
                <h1 id="playlist_name">PLAYLIST NAME!</h1>
                <button id="togglePlaylistContainer" class="hidePlaylistContainer" onclick="togglePlaylistContainer()">Hide</button>
            </div>
            <div id="playlist"></div>
        </div>
    </div>
    <script src="index.js"></script>
</body>
</html>
